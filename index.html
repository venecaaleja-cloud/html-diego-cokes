<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 11: Cookie Consent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Fondo original y sencillo -->
    <div class="contenido-principal">
        <h1>Bienvenido a mi Sitio Web</h1>
        <p>Este es un proyecto de practica de diegooo</p>
        <p>Si recargas la página después de aceptar las cookies, el aviso ya no debería aparecer.</p>
    </div>

    <!-- El Banner de Cookies (Oculto inicialmente con la clase 'oculto') -->
    <div id="cookie-banner" class="cookie-banner oculto">
        <button id="cerrar-btn" class="cerrar-btn">&times;</button>
        <div class="icono-cookie">🍪</div>
        <p>Usamos cookies para mejorar tu experiencia de usuario.</p>
        <button id="aceptar-btn" class="aceptar-btn">Me gustan las Cookies</button>
    </div>

    <script src="java.js"></script>
</body>
</html>
